var d=ds(),n=ST.today.d===d?ST.today.n:0,live=(ST.last===d||ST.last===ds(-1))?ST.streak:0,f=Math.min(1,n/ST.goal),L=2*Math.PI*34;

'<div class="goal"><svg class="ring" viewBox="0 0 84 84"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--bd)" stroke-width="7"/><circle cx="42" cy="42" r="34" fill="none" stroke="var(--ac)" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+(L*f)+' '+L+'" transform="rotate(-90 42 42)"/><text x="42" y="50" text-anchor="middle">'+Math.min(n,ST.goal)+'/'+ST.goal+'</text></svg><div><b>Meta de hoje</b><div class="mu">'+(n>=ST.goal?"Cumprida. Bom trabalho.":"Lê "+ST.goal+(ST.goal===1?" capítulo":" capítulos")+" para manter a sequência.")+'</div><div style="margin-top:6px">🔥 '+live+(live===1?" dia":" dias")+' seguidos</div></div></div>';

if(last)h+='<button class="cont" onclick="openBook('+last.id+')"><span style="font-size:13px;opacity:.8">Continuar a ler</span><b>'+esc(last.title)+'</b><span style="font-size:14px">'+(last.type==="epub"?"Capítulo "+(last.pos.c+1)+" de "+last.n:"Página "+last.pos.c+" de "+last.n)+' · '+pct(last)+'%</span></button>';

function opf(buf){return JSZip.loadAsync(buf).then(function(z){return z.file("META-INF/container.xml").async("string").then(function(c){var p=c.match(/full-path="([^"]+)"/)[1];return z.file(p).async("string").then(function(x){

var sp=[];dc.querySelectorAll("spine > itemref").forEach(function(r){var i=mf[r.getAttribute("idref")];if(i&&/html/.test(i.getAttribute("media-type")||"")){var q=rp(p,i.getAttribute("href"));if(z.file(q))sp.push(q)}});
var t=dc.getElementsByTagNameNS("*","title")[0],a=dc.getElementsByTagNameNS("*","creator")[0];
return{z:z,spine:sp,title:t?t.textContent.trim():"",author:a?a.textContent.trim():""}})})})}

function imp(fs){var ps=[].slice.call(fs).map(function(f){var ext=f.name.split(".").pop().toLowerCase(),nm=f.name.replace(/\.[^.]+$/,"");
return f.arrayBuffer().then(function(buf){var id=Date.now()+Math.floor(Math.random()*1000);
if(ext==="epub")return opf(buf.slice(0)).then(function(e){return{id:id,type:"epub",title:e.title||nm,author:e.author,n:e.spine.length,pos:{c:0,y:0,max:0}}}).then(function(m){return DB.putFile(id,buf).then(function(){return DB.put(m)})});
if(ext==="pdf")return pdfjsLib.getDocument({data:buf.slice(0)}).promise.then(function(d){return DB.putFile(id,buf).then(function(){return DB.put({id:id,type:"pdf",title:nm,author:"",n:d.numPages,pos:{c:1,y:0,max:1}})})});
toast("Formato não suportado: "+f.name)}).catch(function(){toast("Não consegui abrir "+f.name)})});
Promise.all(ps).then(function(){return DB.all()}).then(function(a){BK=a;home()})}

function view(v){$("#home").className="v"+(v==="home"?" on":"");$("#rd").className="v"+(v==="rd"?" on":"");window.scrollTo(0,0)}
function openBook(id){cur=BK.filter(function(b){return b.id===id})[0];cur.opened=Date.now();$("#ttl").textContent=cur.title;view("rd");$("#set").classList.remove("on");setUI();
DB.file(id).then(function(buf){

(function(){var st=0,sx=0,sy=0,lx=0,ly=0,d0=1,dn=1,pinch=false,sw=false,aN=true,aP=true,last=0,tt,rd=document.getElementById("rd");

function zoom(r){if(cur.type==="epub"||ST.pm==="txt"){ST.fs=Math.max(14,Math.min(36,Math.round(ST.fs*r)));sst()}else{ZM=Math.max(1,Math.min(4,ZM*r));showPg(cur.pos.c,true)}}
